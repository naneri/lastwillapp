services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www/html
        working_dir: /var/www/html
        depends_on:
            - mysql
            - mailpit

    nginx:
        image: nginx:alpine
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www/html
        working_dir: /var/www/html
        command: php artisan schedule:work
        depends_on:
            - mysql

    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www/html
        working_dir: /var/www/html
        command: php artisan queue:work --tries=3
        depends_on:
            - mysql
            - mailpit

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: lastwillapp
            MYSQL_USER: lastwillapp
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: secret
        ports:
            - "3306:3306"
        volumes:
            - mysql-data:/var/lib/mysql

    mailpit:
        image: axllent/mailpit
        ports:
            - "8025:8025"
            - "1025:1025"

volumes:
    mysql-data:
